<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>YouMentor AI - My Notebook</title>

    <link rel="stylesheet" href="notes.css">

</head>

<body>

    <div class="container">

        <header class="page-header">

            <div>

                <h1>📚 My AI Notebook</h1>

                <p>
                    Your saved learning material in one place
                </p>

            </div>

            <div class="stats">

                <span id="noteCount">
                    0 Study Pages
                </span>

            </div>

        </header>


        <div class="search-wrapper">

            <input
                type="text"
                id="searchBox"
                placeholder="🔍 Search your study pages..."
            >

        </div>


        <div id="notesContainer"></div>

    </div>


    <script type="module" src="notes.js"></script>

</body>

</html>
